<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Test</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        #quiz-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
        }
        .question {
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        .options button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
            cursor: pointer;
            text-align: left;
        }
        .options button:hover {
            background-color: #e9e9e9;
        }
        .options button.selected {
            background-color: #d0e0f0;
            border-color: #a0c0e0;
        }
        #navigation button {
            padding: 10px 20px;
            margin-top: 20px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        #navigation button:disabled {
            background-color: #ccc;
        }
        #navigation button:hover:not(:disabled) {
            background-color: #0056b3;
        }
        #score-container {
            margin-top: 20px;
            font-size: 1.2em;
        }
        .feedback {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        .feedback.correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .feedback.incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>Mock Test</h1>
    <div id="quiz-container">
        <div id="question-container">
            <p class="question"></p>
            <div class="options"></div>
        </div>
        <div id="feedback-container" class="feedback" style="display: none;"></div>
        <div id="navigation">
            <button id="next-btn">Next</button>
        </div>
        <div id="score-container" style="display: none;">
            <h2>Test Completed!</h2>
            <p>Your score: <span id="score"></span> out of <span id="total-questions"></span></p>
            <button id="restart-btn">Restart Test</button>
        </div>
    </div>

    <script>
        const testQuestions = [
            {
                question: "What is the capital of France?",
                options: ["Berlin", "Madrid", "Paris", "Rome"],
                correct_answer: 2
            },
            {
                question: "What is the value of pi (approximately)?",
                options: ["3.14", "2.71", "1.61", "4.20"],
                correct_answer: 0
            },
            {
                question: "Which programming language is this code written in?",
                options: ["Java", "Python", "C++", "JavaScript"],
                correct_answer: 1 // Assuming the context is the Python script, but for JS it would be 3
            },
            {
                question: "What does HTML stand for?",
                options: ["Hyper Trainer Marking Language", "Hyper Text Markup Language", "High Tech Modern Language", "Hyperlink and Text Markup Language"],
                correct_answer: 1
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOptionButton = null;

        const questionElement = document.querySelector('.question');
        const optionsElement = document.querySelector('.options');
        const nextButton = document.getElementById('next-btn');
        const scoreContainer = document.getElementById('score-container');
        const scoreElement = document.getElementById('score');
        const totalQuestionsElement = document.getElementById('total-questions');
        const questionContainer = document.getElementById('question-container');
        const feedbackContainer = document.getElementById('feedback-container');
        const restartButton = document.getElementById('restart-btn');

        function loadQuestion() {
            feedbackContainer.style.display = 'none';
            selectedOptionButton = null;
            nextButton.textContent = "Next";
            nextButton.disabled = true;


            if (currentQuestionIndex < testQuestions.length) {
                const currentQuestion = testQuestions[currentQuestionIndex];
                questionElement.textContent = currentQuestion.question;
                optionsElement.innerHTML = '';

                currentQuestion.options.forEach((option, index) => {
                    const button = document.createElement('button');
                    button.textContent = option;
                    button.addEventListener('click', () => selectOption(button, index));
                    optionsElement.appendChild(button);
                });
                questionContainer.style.display = 'block';
                scoreContainer.style.display = 'none';
            } else {
                showScore();
            }
        }

        function selectOption(button, index) {
            if (selectedOptionButton) {
                selectedOptionButton.classList.remove('selected');
            }
            selectedOptionButton = button;
            selectedOptionButton.classList.add('selected');
            nextButton.disabled = false; // Enable next button once an option is selected

            // Check answer immediately
            const currentQuestion = testQuestions[currentQuestionIndex];
            if (index === currentQuestion.correct_answer) {
                feedbackContainer.textContent = "Correct!";
                feedbackContainer.className = 'feedback correct';
                if(nextButton.textContent !== "View Results"){ // only add score if not already answered
                     score++;
                }
            } else {
                feedbackContainer.textContent = `Incorrect. The correct answer was: ${currentQuestion.options[currentQuestion.correct_answer]}`;
                feedbackContainer.className = 'feedback incorrect';
            }
            feedbackContainer.style.display = 'block';

            // Disable option buttons after an answer is selected and feedback is given
            const optionButtons = optionsElement.querySelectorAll('button');
            optionButtons.forEach(btn => btn.disabled = true);

            if (currentQuestionIndex === testQuestions.length - 1) {
                nextButton.textContent = "View Results";
            }
        }

        nextButton.addEventListener('click', () => {
            if (currentQuestionIndex < testQuestions.length -1 && selectedOptionButton) {
                 currentQuestionIndex++;
                 loadQuestion();
                 const optionButtons = optionsElement.querySelectorAll('button');
                 optionButtons.forEach(btn => btn.disabled = false); // Re-enable buttons for next q
            } else if (selectedOptionButton) { // Last question answered or view results
                showScore();
            }
        });

        restartButton.addEventListener('click', () => {
            currentQuestionIndex = 0;
            score = 0;
            selectedOptionButton = null;
            nextButton.disabled = true;
            scoreContainer.style.display = 'none';
            questionContainer.style.display = 'block';
            feedbackContainer.style.display = 'none';
            loadQuestion();
        });

        function showScore() {
            questionContainer.style.display = 'none';
            feedbackContainer.style.display = 'none';
            scoreContainer.style.display = 'block';
            scoreElement.textContent = score;
            totalQuestionsElement.textContent = testQuestions.length;
            nextButton.style.display = 'none'; // Hide next button on score page
        }

        // Initial load
        loadQuestion();
    </script>
</body>
</html>
